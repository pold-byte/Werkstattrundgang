<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Folien - Vorschau</title>
  <link rel="stylesheet" href="./src/folien.css">
  <style>
    /* Prueft eine einzelne Folie ohne den Rundgang: gleiche Groessenlogik wie
       im Vortrag, nur ohne die gedaempfte Halle dahinter.
       Aufruf: folien-vorschau.html?nr=4 */
    body { margin: 0; background: #0a0d2d; overflow: hidden; }
    #folienschau { background: none !important; }
    .f-folie { box-shadow: 0 0 0 1px #3a4190; }
  </style>
</head>
<body>
  <div id="folienschau"></div>
  <script type="module">
    import { folien } from './src/folien-inhalt.js';
    import { erzeugeFolienschau } from './src/folien.js';
    const wurzel = document.getElementById('folienschau');
    const nr = Number(new URLSearchParams(location.search).get('nr') || 1);
    const schau = erzeugeFolienschau(wurzel, { haupt: folien, zusatz: [] });
    schau.geheZu(nr);
    schau.oeffne();
    document.body.classList.remove('folien-klein'); // auch die Titelfolie in voller Groesse
    schau.passeAn();
    window.addEventListener('resize', () => schau.passeAn());
    window.schau = schau;
  </script>
</body>
</html>
